[workspace]
resolver = "3"
members = [
    "crates/mgc-formats",
    "crates/mgc-import",
    "crates/mgc-sim",
    "crates/mgc-render",
    "crates/mgc-audio",
    "crates/mgc-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["mgcarpet contributors"]

[profile.dev]
# Data decompression is unusably slow at opt-level 0; the importer chews
# through megabytes of RNC even in dev builds.
opt-level = 1
