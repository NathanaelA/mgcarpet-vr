[package]
name = "mgc-formats"
description = "The .mgcl level-package format shared between the importer and the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
# `memmem` for the reader's skip path (`Recording::skip_to`): a SIMD
# substring SELECT over lines the parser is not going to see.
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# `deflate` is for saves only (`mgcs.rs`): `.mgcl` members stay Stored
# so identical content keeps producing identical bytes. A save payload
# is ~570 KiB of mostly-repetitive terrain and pool, and has no
# committed-hash pinning requirement to preserve.
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[lints]
workspace = true
