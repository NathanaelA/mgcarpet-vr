[package]
name = "mgc-import"
description = "Importer/baker: expands original GOG game data into engine packages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
flacenc = "0.5.1"
mgc-formats = { path = "../mgc-formats" }
mgc-sim = { path = "../mgc-sim" }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
nuked-opl3 = "0.1.0"
oxisynth = { version = "0.1.0", features = ["i16-out"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "mgc-import"
path = "src/main.rs"

[lints]
workspace = true
