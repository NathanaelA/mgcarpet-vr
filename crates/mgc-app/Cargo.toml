[package]
name = "mgc-app"
description = "Game shell: window, input, game loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mgc-formats = { path = "../mgc-formats" }
# The embedded importer: the game bakes its own data on first run /
# stale epoch (src/bakecheck.rs) instead of shipping a second binary.
mgc-import = { path = "../mgc-import" }
mgc-sim = { path = "../mgc-sim" }
mgc-render = { path = "../mgc-render" }
wgpu = "24"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mgc-audio = { version = "0.1.0", path = "../mgc-audio" }

# X11 only: the boot-grab focus hammer. winit's `focus_window` merely
# petitions the WM (`_NET_ACTIVE_WINDOW`, timestamp 0), which
# focus-stealing-prevention WMs are free to ignore — `XSetInputFocus`
# is the protocol primitive they cannot veto (what SDL does). Same
# version winit already carries; no new build cost. Scoped to the
# targets winit's own X11 backend covers.
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies]
x11rb = "0.13"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
openxr = {git = "https://github.com/Ralith/openxrs", branch = "master"}
# Must resolve to the exact ash version wgpu-hal 24 uses (currently
# 0.38.0+1.3.281, pinned in Cargo.lock) so `ash::Device`/`ash::Instance`
# handles passed between wgpu-hal and openxr are the same Rust type.
ash = "0.38.0+1.3.281"
winit = { version = "0.30.13", features = [ "android-native-activity",]}
jni-min-helper = "0.4.7"

# The library target is the implicit src/lib.rs; `lib` (rlib) is what
# the desktop bins link, `cdylib` is the Android/OpenXR shell's shared
# object (`android_main` entry).
[lib]
crate-type = ["lib", "cdylib"]

# Tests only: fabricating an OLD-format `.mgcs` to prove the salvage
# path recovers campaign progress from a container, this build cannot
# apply. Nothing in the binary writes ZIPs — `mgc-formats` owns that.
[dev-dependencies]
zip = { version = "2", default-features = false }

[[bin]]
name = "mgcarpet"
path = "src/main.rs"

[lints]
workspace = true

# cargo-apk2 configuration: builds the `mgc-app` cdylib into an APK,
# compiles any Java sources under `android/src/main/java`, and bundles
# extra shared libraries from `android/src/main/jniLibs`.
[package.metadata.android]
use_aapt2 = true
package = "com.mgcarpet.vr"
build_targets = ["aarch64-linux-android"]
apk_name = "mgcarpet-vr"
java_sources = "android/src/main/java"
runtime_libs = "android/src/main/jniLibs"
resources = "android/src/main/res"
strip = "strip"
manifest_override = "android/AndroidManifest.xml"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 29
compile_sdk_version = 29
# If we use 30 or above, we have to deal with managed storage
# https://stackoverflow.com/questions/62782648/android-11-scoped-storage-permissions

[package.metadata.android.signing.release]
path = "android/build/debug.keystore"
keystore_password = "android"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "com.oculus.feature.PASSTHROUGH"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"


[package.metadata.android.application]
label = "Magic Carpet VR"
request_legacy_external_storage = true
extract_native_libs = true
#icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "quest2|questpro|quest3|quest3s"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
exported = true
resizeable_activity = false
orientation = "landscape"
launch_mode = "singleTask"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "mgc_app"

[[package.metadata.android.application.activity.meta_data]]
name = "com.oculus.intent.category.VR"
value = "vr_only"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
    "android.intent.category.LAUNCHER",
    "com.oculus.intent.category.VR",
]

[[package.metadata.android.application.activity]]
name = "rust.jniminhelper.PermActivity"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
resizeable_activity = false
orientation = "landscape"
launch_mode = "singleTask"
