[package]
name = "mgc-app"
description = "Game shell: window, input, game loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mgc-formats = { path = "../mgc-formats" }
# The embedded importer: the game bakes its own data on first run /
# stale epoch (src/bakecheck.rs) instead of shipping a second binary.
mgc-import = { path = "../mgc-import" }
mgc-sim = { path = "../mgc-sim" }
mgc-render = { path = "../mgc-render" }
winit = "0.30"
wgpu = "24"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mgc-audio = { version = "0.1.0", path = "../mgc-audio" }

[[bin]]
name = "mgcarpet"
path = "src/main.rs"

[lints]
workspace = true
