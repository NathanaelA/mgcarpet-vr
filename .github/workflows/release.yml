name: Release

# Binary releases for playtesters: push a `v*` tag (or run manually
# for a dry run — the manual run only uploads workflow artifacts, no
# Release is created). The game is engine-only; testers bring their
# own GOG data and the binary bakes it on first run (see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported LTS runner = oldest glibc the binary
          # demands; newer distros run it fine.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies (ALSA headers for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mgc-app -p mgc-import
      - name: Package
        shell: bash
        run: |
          name="mgcarpet-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$bin/mgcarpet.exe" "$bin/mgc-import.exe" "dist/$name/"
          else
            cp "$bin/mgcarpet" "$bin/mgc-import" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          # The ready-to-fill gamedata/ folder: its README describes
          # the expected GOG-install layout (referenced by the main
          # README's quickstart) — testers drop their retail packs in
          # next to the binary and run.
          mkdir -p "dist/$name/gamedata"
          cp gamedata/README.md "dist/$name/gamedata/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mgcarpet-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
